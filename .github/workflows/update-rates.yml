name: Update Rates & Square

on:
  schedule:
    - cron: '0 6 * * *'   # Tous les jours à 6h UTC
  workflow_dispatch:        # Permet le déclenchement manuel

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update taux.json (official rates)
        run: python fetch_taux.py
        continue-on-error: true

      - name: Scrape square.json (parallel market)
        run: python scrape_square.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taux.json square.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update rates $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
