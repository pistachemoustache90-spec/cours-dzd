name: Mise à jour des taux
on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les taux
        run: curl -s "https://open.er-api.com/v6/latest/USD" -o taux.json
      - name: Valider le JSON
        run: python -c "import json; json.load(open('taux.json'))"
      - name: Commiter et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taux.json
          git diff --cached --quiet || git commit -m "chore: taux $(date -u +%F)"
          git push
