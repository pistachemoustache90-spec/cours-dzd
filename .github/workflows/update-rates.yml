name: Mise à jour des taux
on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Taux officiels
        run: curl -s "https://open.er-api.com/v6/latest/USD" -o taux.json

      - name: Valider taux.json
        run: python3 -c "import json; json.load(open('taux.json'))"

      - name: Taux du square (scraping)
        run: python3 scrape_square.py

      - name: Commiter et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taux.json square.json
          git diff --cached --quiet || git commit -m "chore: taux $(date -u +%F)"
          git pull --rebase origin main
          git push
