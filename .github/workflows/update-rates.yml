name: Update Rates & Square

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update taux.json (official rates)
        run: curl -s "https://open.er-api.com/v6/latest/USD" -o taux.json

      - name: Scrape square.json (parallel market)
        run: python scrape_square.py
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taux.json square.json
          git diff --staged --quiet && echo "No changes to commit" || {
            git commit -m "chore: update rates $(date +%Y-%m-%d)"
            git pull --rebase origin main || git rebase --abort
            git push --force-with-lease
          }
